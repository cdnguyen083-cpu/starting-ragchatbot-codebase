[project]
name = "starting-codebase"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb==1.0.15",
    "anthropic==0.58.2",
    "sentence-transformers==5.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "python-dotenv==1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # required by fastapi.testclient.TestClient (Starlette)
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# Cleaner, more informative default output. -ra summarizes non-passing tests;
# --strict-markers turns a typo'd marker into an error instead of a warning.
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
    "--color=yes",
]
markers = [
    "api: HTTP-layer tests that drive the FastAPI endpoints via TestClient",
]
